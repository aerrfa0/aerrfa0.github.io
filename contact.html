<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김성태 | Contact</title>
<meta name="description" content="업무 프로세스 설계·시스템 구축 | 커머스·D2C, CRM(Salesforce), SAP 약 9년">
<meta property="og:type" content="website">
<meta property="og:title" content="김성태 | Contact">
<meta property="og:description" content="업무 프로세스 설계·시스템 구축 | 커머스·D2C, CRM(Salesforce), SAP 약 9년">
<meta property="og:url" content="https://aerrfa0.github.io/contact.html">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f2a47'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2a47; --accent:#1f5f9e; --tint:#e8f0f9; --ink:#1b2430;
    --muted:#5f6b7a; --line:#e1e6ed; --bg:#f3f5f8; --hdr-sub:#c9d6e6; --glow:#5aa0e6; --soft:#9fb6d1;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);word-break:keep-all;
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.7}
  a{color:inherit}
  .wrap{max-width:960px;margin:0 auto;padding:0 40px}

  header.band{background:var(--navy);color:#fff;padding:0 0 48px}
  header.band .topnav{padding:22px 0 18px;margin-bottom:40px;border-bottom:1px solid rgba(255,255,255,.12)}

  .topnav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 28px}
  .brand{color:#fff;text-decoration:none;font-weight:700;font-size:16px;letter-spacing:.02em;white-space:nowrap}
  .brand small{font-weight:400;font-size:13px;color:#9fb6d1;margin-left:8px;letter-spacing:0}
  .menu{display:flex;gap:2px 24px;margin:0;padding:0;list-style:none;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .menu::-webkit-scrollbar{display:none}
  .menu a{display:block;padding:6px 0 4px;color:#c9d6e6;text-decoration:none;font-size:14.5px;font-weight:500;
    white-space:nowrap;border-bottom:2px solid transparent}
  .menu a:hover{color:#fff}
  .menu a[aria-current="page"]{color:#fff;border-bottom-color:#5aa0e6}
  .menu a:focus-visible,.brand:focus-visible{outline:2px solid #5aa0e6;outline-offset:3px}
  @media (max-width:760px){ .menu{gap:2px 20px} .menu a{font-size:14px} }

  .lead{margin:12px 0 0;font-size:18px;line-height:1.6;color:var(--hdr-sub);max-width:40em}
  .alt{margin:16px 0 0;font-size:13.5px}
  .alt a{color:var(--hdr-sub);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
  .alt a:hover{color:#fff;border-bottom-color:#fff}
  .foot{padding:8px 0 36px;color:var(--muted);font-size:12.5px}
  .foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 20px}
  .foot a{text-decoration:none}
  .foot a:hover{color:var(--accent)}
  h1{margin:0;font-size:44px;line-height:1.15;font-weight:700;letter-spacing:.04em}
  .en{margin:6px 0 0;font-size:16px;color:var(--hdr-sub)}
  .role{margin:24px 0 0;font-size:19px;font-weight:500;line-height:1.5}
  .sub{margin:4px 0 0;color:var(--hdr-sub)}
  .contact{display:flex;flex-wrap:wrap;gap:6px 28px;margin:22px 0 0;padding:16px 0 0;
    border-top:1px solid rgba(255,255,255,.16);list-style:none;font-size:14.5px}
  .contact span{color:#9fb6d1;margin-right:8px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
  .contact a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
  .contact a:hover{border-bottom-color:#fff}

  @media (max-width:760px){
    .wrap{padding:0 20px}
    header.band{padding:0 0 32px}
    header.band .topnav{padding:16px 0 12px;margin-bottom:26px}
    h1{font-size:32px}
    .lead{font-size:16px}
    .role{font-size:17px;margin-top:18px}
    .contact{flex-direction:column}
  }

  main.wrap{padding-top:32px;padding-bottom:64px}
  p{margin:0}
  section{display:grid;grid-template-columns:190px 1fr;column-gap:40px;
    background:#fff;border:1px solid var(--line);border-radius:6px;padding:34px 40px;margin-bottom:20px}
  section.wide{display:block}
  section.wide>h2{margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--line)}
  h2{margin:0;font-size:17px;line-height:1.6;font-weight:700;color:var(--navy)}
  .tag{display:inline-block;background:var(--tint);color:var(--accent);font-weight:700;font-size:13.5px;
    padding:2px 12px;border-radius:4px;line-height:1.7;white-space:nowrap}
  .prose{line-height:1.9}
  .prose p+p{margin-top:12px}
  dl.rows{margin:0;display:grid;grid-template-columns:150px 1fr;row-gap:16px;column-gap:24px;align-items:baseline}
  dl.rows dt{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
  dl.rows dd{margin:0}
  dl.rows dd small{display:block;margin-top:2px;color:var(--muted);font-size:13.5px}
  .pills{display:flex;flex-wrap:wrap;gap:6px 8px}
  .pills span{font-size:13.5px;line-height:1.6;padding:2px 10px;border:1px solid var(--line);border-radius:4px;background:#f8fafc}
  .next{display:flex;flex-wrap:wrap;gap:12px;margin:28px 0 8px}
  .btn{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:6px;border:1px solid var(--accent);
    color:var(--accent);background:#fff;text-decoration:none;font-weight:700;font-size:15px}
  .btn:hover{background:var(--tint)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--navy);border-color:var(--navy)}
  .btn:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
  @media (max-width:760px){
    section{grid-template-columns:1fr;row-gap:16px;padding:24px 20px}
    dl.rows{grid-template-columns:1fr;row-gap:2px}
    dl.rows dd{margin-bottom:14px}
    .next{flex-direction:column}
    .btn{justify-content:center}
  }

  .cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .cc{background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px 24px;display:flex;flex-direction:column}
  .cc h2{font-size:14px;color:var(--muted)}
  .cc .big{margin-top:6px;font-size:20px;line-height:1.4;font-weight:700;color:var(--navy);text-decoration:none;word-break:break-all}
  .cc .big:hover{color:var(--accent)}
  .cc p.desc{margin-top:6px;color:var(--ink);font-size:14.5px}
  .cc .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:18px}
  .mini{appearance:none;display:inline-flex;align-items:center;font:inherit;font-size:13.5px;font-weight:500;padding:7px 12px;
    border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;text-decoration:none}
  .mini:hover{border-color:var(--accent);color:var(--accent)}
  .mini.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .mini.primary:hover{background:var(--navy);border-color:var(--navy);color:#fff}
  .mini:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
  @media (max-width:860px){ .cgrid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <nav class="topnav" aria-label="Main"><a class="brand" href="./">김성태<small>Sung-tae Kim</small></a><ul class="menu"><li><a href="about.html">About</a></li><li><a href="resume.html">Resume</a></li><li><a href="case-studies.html">Case Studies</a></li><li><a href="contact.html" aria-current="page">Contact</a></li></ul></nav>
  <h1>Contact</h1>
  <p class="lead">이메일로 연락 주세요.</p>
</div></header>

<main class="wrap">
  <div class="cgrid">
    <div class="cc"><h2>Email</h2><a class="big" href="mailto:aerrfa@gmail.com">aerrfa@gmail.com</a>
      <div class="row"><a class="mini primary" href="mailto:aerrfa@gmail.com">메일 쓰기</a><button class="mini" type="button" data-copy="aerrfa@gmail.com">복사</button></div></div>
    <div class="cc"><h2>연락처 저장</h2><p class="desc">이름, 이메일, 홈페이지 주소를 휴대폰 주소록에 한 번에 저장합니다.</p>
      <div class="row"><a class="mini primary" href="kim-sungtae.vcf" download>연락처 파일 받기 (.vcf)</a></div></div>
  </div>
  <div class="next">
    <a class="btn primary" href="resume.html">Resume 보기 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <a class="btn" href="case-studies.html">Case Studies 보기 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</main>
<footer class="foot"><div class="wrap"><span>© 2026 김성태</span><a href="mailto:aerrfa@gmail.com">aerrfa@gmail.com</a></div></footer>

<script>
[].forEach.call(document.querySelectorAll('[data-copy]'),function(b){
  b.addEventListener('click',function(){
    var v=b.getAttribute('data-copy'), label=b.textContent;
    function show(ok){ b.textContent=ok?'복사됨':'복사 안 됨'; setTimeout(function(){b.textContent=label;},1600); }
    function fallback(){ var t=document.createElement('textarea'); t.value=v; t.setAttribute('readonly',''); t.style.position='absolute'; t.style.left='-9999px';
      document.body.appendChild(t); t.select(); var ok=false; try{ok=document.execCommand('copy');}catch(e){} document.body.removeChild(t); show(ok); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(function(){show(true);},fallback); } else fallback();
  });
});
</script>
</body>
</html>
