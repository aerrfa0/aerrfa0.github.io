<style>
  :root{
    --navy:#0f2a47; --accent:#1f5f9e; --tint:#e8f0f9; --ink:#1b2430;
    --muted:#5f6b7a; --line:#e1e6ed; --bg:#f3f5f8; --hdr-sub:#c9d6e6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.7}
  a{color:inherit}
  .wrap{max-width:960px;margin:0 auto;padding:0 40px}

  header.band{background:var(--navy);color:#fff;padding:56px 0 48px}
  .home{display:inline-block;margin-bottom:18px;color:var(--hdr-sub);font-size:14px;text-decoration:none}
  .home:hover{color:#fff}
  h1{margin:0;font-size:44px;line-height:1.15;font-weight:700;letter-spacing:.04em}
  .en{margin:6px 0 0;font-size:16px;color:var(--hdr-sub)}
  .role{margin:24px 0 0;font-size:19px;font-weight:500;line-height:1.5}
  .sub{margin:4px 0 0;color:var(--hdr-sub)}
  .contact{display:flex;flex-wrap:wrap;gap:6px 28px;margin:22px 0 0;padding:16px 0 0;
    border-top:1px solid rgba(255,255,255,.16);list-style:none;font-size:14.5px}
  .contact span{color:#9fb6d1;margin-right:8px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
  .contact a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
  .contact a:hover{border-bottom-color:#fff}

  @media (max-width:760px){
    .wrap{padding:0 20px}
    header.band{padding:36px 0 32px}
    h1{font-size:32px}
    .role{font-size:17px;margin-top:18px}
    .contact{flex-direction:column}
  }

  body{min-height:100vh;display:flex;flex-direction:column}
  main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:56px 20px}
  .lock{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:32px}
  .lock h2{margin:0 0 6px;font-size:18px;color:var(--navy)}
  .lock p{margin:0 0 20px;color:var(--muted);font-size:14px}
  .lock label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
  .lock input{width:100%;font:inherit;padding:12px 14px;border:1px solid #c8d1dc;border-radius:4px}
  .lock input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
  .lock button{width:100%;margin-top:14px;font:inherit;font-weight:700;padding:12px;border:0;border-radius:4px;
    background:var(--accent);color:#fff;cursor:pointer}
  .lock button:hover{background:var(--navy)}
  .lock button[disabled]{opacity:.6;cursor:wait}
  .err{min-height:20px;margin:10px 0 0!important;color:#b42318!important}
  .back{display:block;margin-top:18px;text-align:center;font-size:13.5px;color:var(--muted)}
  .noscript{color:#b42318}
</style>

    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,
      {name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));
    var html=new TextDecoder().decode(pt);
    try{sessionStorage.setItem('cv-pw',pw);}catch(e){}
    document.open();document.write(html);document.close();
  }
  var f=document.getElementById('f'),go=document.getElementById('go'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='이 브라우저에서는 열 수 없습니다. 최신 브라우저로 접속해 주세요.';go.disabled=true;return;}
  f.addEventListener('submit',function(ev){
    ev.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Checking…';
    open(document.getElementById('pw').value).catch(function(){
      err.textContent='비밀번호가 맞지 않습니다.'; go.disabled=false; go.textContent='Unlock';
      document.getElementById('pw').select();
    });
  });
  var saved=null; try{saved=sessionStorage.getItem('cv-pw');}catch(e){}
  if(saved) open(saved).catch(function(){try{sessionStorage.removeItem('cv-pw');}catch(e){}});
})();
</script>
</body>
