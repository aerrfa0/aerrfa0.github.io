<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김성태</title>
<meta name="description" content="업무 프로세스 설계·시스템 구축 | 커머스·D2C, CRM(Salesforce), SAP 약 9년">
<meta property="og:type" content="website">
<meta property="og:title" content="김성태">
<meta property="og:description" content="업무 프로세스 설계·시스템 구축 | 커머스·D2C, CRM(Salesforce), SAP 약 9년">
<meta property="og:url" content="https://aerrfa0.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2a47;
    --accent:#1f5f9e;
    --tint:#e8f0f9;
    --ink:#1b2430;
    --muted:#5f6b7a;
    --line:#e1e6ed;
    --bg:#f3f5f8;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.7;
  }
  .top{background:var(--navy);color:#fff;padding:72px 24px 64px}
  .wrap{max-width:640px;margin:0 auto}
  .eyebrow{margin:0 0 10px;font-size:13px;letter-spacing:.12em;color:#9fb6d1;text-transform:uppercase}
  h1{margin:0;font-size:44px;line-height:1.15;font-weight:700;letter-spacing:.04em}
  .en{margin:6px 0 0;font-size:16px;color:#c9d6e6}
  .role{margin:28px 0 0;font-size:19px;font-weight:500;line-height:1.5}
  .sub{margin:6px 0 0;color:#c9d6e6}

  main{flex:1;padding:40px 24px 56px}
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px}
  h2{margin:0 0 14px;font-size:15px;font-weight:700;color:var(--navy)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
  .chips li{background:var(--tint);color:var(--accent);font-weight:500;font-size:14px;padding:4px 12px;border-radius:4px}
  .now{margin:24px 0 0;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
  .now b{color:var(--ink);font-weight:500}

  .cta{
    display:block;margin-top:24px;padding:16px 20px;border-radius:8px;
    background:var(--accent);color:#fff;text-align:center;text-decoration:none;
    font-size:16px;font-weight:700;
  }
  .cta:hover{background:var(--navy)}
  .cta:focus-visible{outline:3px solid var(--navy);outline-offset:3px}

  footer{padding:0 24px 32px;text-align:center;color:var(--muted);font-size:12.5px}

  @media (max-width:520px){
    .top{padding:52px 20px 44px}
    h1{font-size:36px}
    .role{font-size:17px}
    main{padding:28px 16px 40px}
    .card{padding:22px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <p class="eyebrow">Profile</p>
    <h1>김성태</h1>
    <p class="en">Sung-tae Kim</p>
    <p class="role">업무 프로세스 설계 · 시스템 구축</p>
    <p class="sub">커머스·D2C, CRM(Salesforce), SAP 영역 약 9년</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="card">
      <h2>수행 산업</h2>
      <ul class="chips">
        <li>유통</li><li>전자</li><li>자동차</li><li>바이오</li><li>보험</li><li>공공</li>
      </ul>
      <p class="now"><b>현재</b> · 삼성전자 GBC 콘텐츠 CoE 구축 참여</p>
    </div>

    <a class="cta" href="resume.html">이력서 보기 →</a>
  </div>
</main>

<footer>© 2026 김성태</footer>

</body>
</html>
