<style>
  :root{
    --navy:#0f2a47; --accent:#1f5f9e; --tint:#e8f0f9; --ink:#1b2430;

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.7}
  a{color:inherit}
  .wrap{max-width:960px;margin:0 auto;padding:0 40px}

  h1{margin:0;font-size:44px;line-height:1.15;font-weight:700;letter-spacing:.04em}
  .en{margin:6px 0 0;font-size:16px;color:var(--hdr-sub)}
  .role{margin:24px 0 0;font-size:19px;font-weight:500;line-height:1.5}
  .sub{margin:4px 0 0;color:var(--hdr-sub)}
  .contact{display:flex;flex-wrap:wrap;gap:6px 28px;margin:22px 0 0;padding:16px 0 0;
    border-top:1px solid rgba(255,255,255,.16);list-style:none;font-size:14.5px}
  .contact span{color:#9fb6d1;margin-right:8px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase}
  .contact a{color:#fff;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
  .contact a:hover{border-bottom-color:#fff}

  @media (max-width:760px){
    .wrap{padding:0 20px}
    header.band{padding:36px 0 32px}
    h1{font-size:32px}
    .role{font-size:17px;margin-top:18px}
    .contact{flex-direction:column}
  }

  body{min-height:100vh;display:flex;flex-direction:column}
  main{flex:1;padding:40px 0 56px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:32px 40px}
  h2{margin:0 0 14px;font-size:17px;font-weight:700;color:var(--navy)}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
  .chips a{display:inline-block;background:var(--tint);color:var(--accent);font-weight:500;font-size:14px;
    padding:5px 14px;border-radius:4px;text-decoration:none;border:1px solid transparent}
  .chips a:hover{border-color:var(--accent)}
  .now{margin:26px 0 0;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14.5px}
  .now b{color:var(--navy);font-weight:700;margin-right:8px}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-radius:6px;
    text-decoration:none;font-size:16px;font-weight:700;border:1px solid var(--accent)}
  .cta small{display:block;font-size:12.5px;font-weight:400;margin-top:2px}
  .cta.primary{background:var(--accent);color:#fff}
  .cta.primary small{color:#d6e4f3}
  .cta.primary:hover{background:var(--navy);border-color:var(--navy)}
  .cta.secondary{background:#fff;color:var(--accent)}
  .cta.secondary small{color:var(--muted)}
  .cta.secondary:hover{background:var(--tint)}
  .cta:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
  footer{padding:0 0 32px;text-align:center;color:var(--muted);font-size:12.5px}
  @media (max-width:760px){
    main{padding:28px 0 40px}
    .card{padding:24px 20px}
    .actions{grid-template-columns:1fr}
  }
