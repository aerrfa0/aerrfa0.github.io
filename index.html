<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김성태</title>
<meta name="description" content="김성태 개인 페이지">
<meta property="og:type" content="website">
<meta property="og:title" content="김성태">
<meta property="og:description" content="김성태 개인 페이지">
<meta property="og:url" content="https://aerrfa0.github.io/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f2a47;
    --accent:#1f5f9e;
    --tint:#e8f0f9;
    --ink:#1b2430;
    --muted:#5f6b7a;
    --line:#e1e6ed;
    --bg:#f3f5f8;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;
    background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:15px;line-height:1.6;
  }
  .wrap{max-width:720px;margin:0 auto}

  .top{background:var(--navy);color:#fff;padding:72px 24px 64px}
  h1{margin:0;font-size:44px;line-height:1.15;font-weight:700;letter-spacing:.04em}
  .en{margin:6px 0 0;font-size:16px;color:#c9d6e6}
  .hello{margin:24px 0 0;font-size:16px;color:#c9d6e6}

  main{flex:1;padding:36px 24px 56px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}

  .card{
    display:flex;flex-direction:column;min-height:150px;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:22px;color:inherit;text-decoration:none;
  }
  .card h2{margin:0;font-size:18px;font-weight:700;color:var(--navy)}
  .card p{margin:6px 0 0;font-size:14px;color:var(--muted)}
  .card .go{margin-top:auto;padding-top:14px;font-size:14px;font-weight:500;color:var(--accent)}

  a.card{transition:border-color .15s, box-shadow .15s}
  a.card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(15,42,71,.08)}
  a.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

  .card.soon{background:transparent;border-style:dashed}
  .card.soon h2{color:var(--muted)}
  .card.soon .go{color:#9aa4b1;font-weight:400}

  footer{padding:0 24px 32px;text-align:center;color:var(--muted);font-size:12.5px}

  @media (max-width:520px){
    .top{padding:52px 20px 44px}
    h1{font-size:36px}
    main{padding:24px 16px 40px}
    .grid{gap:10px}
    .card{padding:18px;min-height:132px}
    .card h2{font-size:16px}
    .card p{font-size:13px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>김성태</h1>
    <p class="en">Sung-tae Kim</p>
    <p class="hello">방문해 주셔서 감사합니다.</p>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid">

      <a class="card" href="resume.html">
        <h2>이력서</h2>
        <p>경력과 프로젝트 이력</p>
        <span class="go">보기 →</span>
      </a>

      <div class="card soon">
        <h2>포트폴리오</h2>
        <p>주요 작업물</p>
        <span class="go">준비 중</span>
      </div>

      <div class="card soon">
        <h2>작업 노트</h2>
        <p>업무 기록과 정리</p>
        <span class="go">준비 중</span>
      </div>

      <div class="card soon">
        <h2>연락처</h2>
        <p>문의 및 연락 방법</p>
        <span class="go">준비 중</span>
      </div>

    </div>
  </div>
</main>

<footer>© 2026 김성태</footer>

</body>
</html>
